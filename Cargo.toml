[package]
authors = [
    "Kartik Sharma <kartik.sharma522@gmail.com>",
    "Ajeet D'Souza <98ajeet@gmail.com>",
]
description = "Extract partitions from Android OTA files"
categories = ["command-line-utilities", "android"]
edition = "2024"
keywords = ["android", "cli", "terminal"]
license = "MIT"
name = "otadump"
repository = "https://github.com/crazystylus/otadump"
readme = "README.md"
rust-version = "1.85.0"
version = "0.1.3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3"]

[build-dependencies]
prost-build = "0.14.1"
protoc-bin-vendored = "3.2.0"

[dependencies]
anyhow = "1.0.69"
brotli = "8.0.2"
bzip2 = { version = "0.6.0" }
clap = { version = "4.2.1", features = ["derive"] }
color-print = "0.3.4"
ctrlc = "3.5.0"
hex = "0.4.3"
indicatif = "0.17.3"
liblzma = { version = "0.4.2", features = ["static"] }
# Pinned exactly. The only published 1.11.1 is `1.11.1+lz4-1.10.0` (Cargo
# ignores `+metadata` in requirements, so the lockfile checksum enforces it):
# it bundles liblz4 1.10.0, byte-identical to the AOSP platform/external/lz4
# sources that Android lz4diff uses.
lz4-sys = "=1.11.1"
memmap2 = "0.9.5"
nom = "7.1.1"
nom-derive = "0.10.1"
prost = "0.14.1"
pyo3 = { version = "0.29.2", optional = true, features = ["abi3-py39", "extension-module"] }
rayon = "1.7.0"
ring = { version = "0.17.11", features = ["std"] }
sync-unsafe-cell = "0.1.0"
tempfile = "3.6.0"
zip = { version = "4.1.0", default-features = false }
zstd = "0.13.2"

[profile.release]
codegen-units = 1
debug = 0
lto = true
strip = true

# Static CLI builds (CI + install.sh): panic=abort drops unwinding machinery.
# Kept out of [profile.release] because maturin wheel builds use the `release`
# profile and must preserve unwinding so panics surface as Python exceptions.
[profile.release-cli]
codegen-units = 1
debug = 0
inherits = "release"
lto = true
panic = "abort"
strip = true
