[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otadump"
version = "0.2.0"
description = "Extract partitions from Android OTA files"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Kartik Sharma", email = "kartik.sharma522@gmail.com" },
    { name = "Ajeet D'Souza", email = "98ajeet@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/AndroidDumps/otadump"

[tool.hatch.build.targets.wheel]
packages = ["otadump"]

[tool.hatch.build.targets.sdist]
include = ["/otadump", "/tests", "/AGENTS.md", "/LICENSE", "/README.md", "/pyproject.toml"]
