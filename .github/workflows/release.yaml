name: release
on:
  push:
    branches: [mainline]
  pull_request:
  workflow_dispatch:
env:
  CARGO_INCREMENTAL: 0
permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # MUSL Targets
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: i686-unknown-linux-musl

          # Android targets
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: armv7-linux-androideabi

          # Darwin targets
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

          # Windows targets
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: Cargo.toml
          field: package.version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig
        if: runner.os == 'Linux' && !contains(matrix.target, 'android')
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && !contains(matrix.target, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cargo-ndk
        if: contains(matrix.target, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Android NDK
        if: contains(matrix.target, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23
          local-cache: true

      - name: Build binary (Linux)
        if: runner.os == 'Linux' && !contains(matrix.target, 'android')
        run: |
          cargo zigbuild --profile release-cli --locked --target=${{ matrix.target }} --color=always --verbose --bin otadump

      - name: Build binary (Android)
        if: contains(matrix.target, 'android')
        run: |
          cargo ndk --target=${{ matrix.target }} build --profile release-cli --locked --color=always --verbose --bin otadump

      - name: Build binary (macOS / Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        run: |
          cargo build --profile release-cli --locked --target=${{ matrix.target }} --color=always --verbose --bin otadump

      - name: Package (*nix)
        if: runner.os != 'Windows'
        run: >
          tar -cv
          LICENSE README.md src/puffin/LICENSE licenses/LICENSE.lz4 licenses/README.md
          -C target/${{ matrix.target }}/release-cli/ otadump
          | gzip --best
          > 'otadump-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.tar.gz'
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: >
          7z a 'otadump-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.zip'
          LICENSE README.md src/puffin/LICENSE licenses/LICENSE.lz4 licenses/README.md
          ./target/${{ matrix.target }}/release-cli/otadump.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.0
        with:
          name: ${{ matrix.target }}
          path: |
            *.deb
            *.tar.gz
            *.zip
      - name: Create release
        if: ${{ github.ref == 'refs/heads/mainline' && startsWith(github.event.head_commit.message, 'chore(release)') }}
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            *.deb
            *.tar.gz
            *.zip
          name: ${{ steps.get_version.outputs.value }}
          tag_name: ""

  wheel-linux-abi3:
    name: wheel manylinux2014 x86_64
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux2014_x86_64@sha256:493d2032114d757aaa761a9385ad8497f391503bf71acef9abeeb66682ca5d90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python build tools
        run: |
          /opt/python/cp39-cp39/bin/python -m pip install --upgrade pip
          /opt/python/cp39-cp39/bin/python -m pip install uv maturin auditwheel

      - name: Validate, test, and build wheel in pinned manylinux
        env:
          PATH: /opt/python/cp39-cp39/bin:${{ env.PATH }}
          OTADUMP_NATIVE_CACHE: /tmp/otadump-native-cache
        run: |
          set -euxo pipefail

          cargo fmt --all -- --check
          cargo check --locked
          cargo test --locked --release --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings

          rm -rf "$OTADUMP_NATIVE_CACHE"
          python3 scripts/fetch-native-artifact.py \
            --bundle-lock native/zucchini/ARTIFACT_BUNDLE_LOCK.json \
            --checksum-lock native/zucchini/ARTIFACT_LOCK.sha256 \
            --out /tmp/otadump-native/linux-x86_64-gnu \
            --cache "$OTADUMP_NATIVE_CACHE"
          python3 tests/native_artifact_fetch_test.py

          uv build --wheel
          auditwheel show dist/*.whl
          auditwheel repair --wheel-dir wheelhouse dist/*.whl

          python -m venv /tmp/otadump-wheel-smoke
          source /tmp/otadump-wheel-smoke/bin/activate
          pip install wheelhouse/*.whl
          python tests/python_smoke.py
          python - <<'PY'
          import pathlib
          import otadump

          extension = next(pathlib.Path(otadump.__file__).parent.glob("otadump*.so"))
          print(extension)
          PY

          SO_PATH=$(python - <<'PY'
          import pathlib
          import otadump

          extension = next(pathlib.Path(otadump.__file__).parent.glob("otadump*.so"))
          print(extension)
          PY
          )
          nm -gD "$SO_PATH" >/tmp/otadump-wheel.nm.txt
          readelf -d "$SO_PATH" >/tmp/otadump-wheel.readelf.txt
          ldd "$SO_PATH" >/tmp/otadump-wheel.ldd.txt

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: python-wheel-manylinux2014-x86_64
          path: |
            dist/*.whl
            wheelhouse/*.whl
            /tmp/otadump-wheel.nm.txt
            /tmp/otadump-wheel.readelf.txt
            /tmp/otadump-wheel.ldd.txt
